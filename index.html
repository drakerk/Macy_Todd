.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brandtxt{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(36,27,25,.12)}

main{max-width:1080px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cal-layout{display:grid;gap:20px}
@media (min-width:860px){ .cal-layout{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start} .calcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)} }

/* month grid */
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.month-title{font-family:var(--serif);font-size:28px;font-weight:500;font-style:italic;letter-spacing:.01em}
.nav{display:flex;gap:4px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.nav button:hover{background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.cell{aspect-ratio:1/1.05;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.cell .n{font-size:15px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.cell.out{opacity:.32}
.cell:hover{background:var(--surface)}
.cell.today .n{border:1.5px solid var(--red);font-weight:600}
.cell.sel{background:var(--surface)}
.cell.sel .n{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.cell.past .n{color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%}
.t-show{background:var(--show)} .t-rehearsal{background:var(--reh)} .t-travel{background:var(--trav)} .t-other{background:var(--other)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.upnext{margin-top:18px;padding:14px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px;cursor:pointer;border:0;text-align:left;width:100%}
.upnext b{font-family:var(--serif);font-size:20px;font-weight:600}
.files-all{margin-top:14px}

/* day sheet */
.sheet{display:flex;flex-direction:column;gap:14px;min-width:0}
.dhead{padding:20px;border-radius:18px;background:var(--sky);color:#241B19}
.dhead.type-show.upcoming{background:var(--sky)}
.dhead.past{background:var(--surface);color:var(--ink)}
.dhead.type-rehearsal{background:#4A6890;color:#F6F1E7}
.dhead.type-travel,.dhead.type-other{background:var(--gum);color:#241B19}
.dhead .eyebrow{color:inherit;opacity:.78}
.ddate{font-family:var(--serif);font-size:19px;font-style:italic;margin-top:6px}
.dvenue{font-family:var(--serif);font-size:38px;line-height:1.02;font-weight:600;margin:4px 0 4px;text-wrap:balance}
.dcity{font-size:15px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(246,241,231,.55);color:#241B19}
.chip.status-Confirmed,.chip.status-Locked{background:#241B19;color:#F6F1E7}
.chip.status-Accepted{background:#F6F1E7;color:#241B19}
.chip.status-Played{background:rgba(36,27,25,.08);color:inherit}
.dhead.past .chip{background:var(--bg);color:var(--ink)}
.dhead.type-rehearsal .chip{background:rgba(246,241,231,.18);color:#F6F1E7}

.card{background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 10px;font-family:var(--serif);font-size:22px;font-weight:600;font-style:italic;display:flex;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:auto}
.twocol{display:grid;gap:14px}
@media (min-width:620px){ .twocol{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sched li{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.sched li:last-child{border-bottom:0}
.sched .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.sched .tm.tba{color:var(--muted);font-weight:500;font-style:italic}
.sched .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);margin-top:5px}
.sched li.mine .pip{background:var(--red);border-color:var(--red)}
.sched li.mine .lb{font-weight:600}
.sched .end{color:var(--muted);font-size:12.5px;display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:16px;background:var(--surface);flex:none}
.av.artist{background:var(--red);color:var(--onred)}
.person .nm{font-weight:500}
.person .rl{font-size:12.5px;color:var(--muted)}
.person.maybe{opacity:.62}
.person .ph{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums;user-select:all;color:var(--muted)}

.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.doc:hover{outline:1px solid var(--line)}
.pdf{flex:none;width:34px;height:42px;border-radius:5px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--red);position:relative}

@media (prefers-reduced-motion:no-preference){

  .dhead.photo::before{animation:kb2 1.4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes kb2{from{transform:scale(1.12)}to{transform:scale(1)}}
  .detail .card{animation:up .5s cubic-bezier(.2,.7,.2,1) both}

}

.btour .bstats{margin-bottom:8px}
.btlist{display:flex;flex-direction:column;gap:10px}
.btcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.btcard .btn-name{font-family:var(--serif);font-size:21px;line-height:1.15;min-width:0;overflow-wrap:anywhere}

.bline:first-of-type{border-top:0}
.bline .bw{font-size:14px;font-weight:500;min-width:0;overflow-wrap:anywhere}

.bform{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:14px;padding:14px}

.bform input,.bform select,.bform textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);width:100%;min-width:0}
.bform .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.bform .chk input{width:auto}
.bform .err{color:var(--red);font-size:13px}
.bacts{display:flex;gap:8px;flex-wrap:wrap}
.bcaa{margin:10px 0 0}
.bdocs{padding:4px 16px;margin-top:10px}
.bdocs>.bform{padding:12px 0}
.bdoc{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.bdoc:first-child{border-top:0}

.bdoc .bw{font-size:14.5px;font-weight:500;min-width:0;overflow-wrap:anywhere}

.bdoc .bm{grid-column:2/4;font-size:12px;color:var(--muted)}
.bdoc .bdl{grid-column:2/4;display:flex;gap:16px;font-size:13px}
.bdoc .bdl button{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--deep);text-decoration:underline;cursor:pointer}

</head><body>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">

</div>
<div class="foot">MACY TODD · TOUR BOOK · DATA AS OF <span id="upd"></span> · HYPHEN MEDIA GROUP</div>

<script>
window.startApp=function(){
const T = window.TOUR;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date(); today.setHours(0,0,0,0); const todayKey=key(today);
const byDate={}; T.days.forEach(d=>{(byDate[d.date]=byDate[d.date]||[]).push(d)});
const sorted=[...T.days].sort((a,b)=>a.date.localeCompare(b.date));
const next=sorted.find(d=>d.date>=todayKey)||sorted[sorted.length-1];
const TYPE={show:"Show",rehearsal:"Rehearsal",travel:"Travel",other:"Day"};
const shortDate=k=>pd(k).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
document.getElementById("upd").textContent=T.updated.toUpperCase();

let state={view:"home", sel:null, showPast:false, from:"dates", anchor:null};
try{ const p=localStorage.getItem("mt-showpast"); if(p) state.showPast=p==="1"; }catch(e){}

const VIEWS=["home","dates","travel","guests","files"].concat(T.dealsBlob?["mgmt","deals","approvals","budget"]:[]);
function readHash(){
  const h=location.hash.slice(1);
  const m=h.match(/^d-(\d{4}-\d{2}-\d{2})(?:-(gl|tv))?$/);
  if(m){ if(state.view!=="day") state.from=state.view; state.view="day"; state.sel=m[1]; state.anchor=m[2]||null; }
  else state.view=VIEWS.includes(h)?h:"home";
}
function go(h){ if(location.hash!=="#"+h){ location.hash=h; } else { readHash(); render(); } }

function scheduleFor(d){
  if(d.schedule) return d.schedule;
  if(d.sasha){
    return [
      {t:null,label:"Load-in"},{t:null,label:"Soundcheck"},{t:"7:00 PM",label:"Doors"},
      {t:"8:00 PM",end:"8:40 PM",label:"Macy Todd",mine:true,sub:d.sasha.setConfirmed?"Set time confirmed by venue":"30–40 min"},
      {t:null,label:"Sasha Alex Sloan",sub:"After Macy"},
      {t:d.sasha.curfew,label:"Curfew"}
    ];
  }
  return [];
}

const PH=["photo-wide.jpg"];
function photoFor(d){ let h=0; for(const c of d.date) h=(h*31+c.charCodeAt(0))>>>0; return PH[h%PH.length]; }
function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join("")}

// ---- Travel (shared, stored in the artifact's database; screenshots read by Claude) ----
const KINDS={flight:"Flight",hotel:"Hotel",car:"Rental car",train:"Train",ground:"Ride / shuttle",other:"Other"};
const KI={
  flight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5 4 11l1.3-1.3 7 .6 4.2-4.2a1.8 1.8 0 0 1 2.6 2.6l-4.2 4.2.6 7L14.2 21l-2.5-6.5-3.2 3.2.3 2.3-1 1-1.6-3.1L3.1 16.3l1-1 2.3.3z"/></svg>',
  hotel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5V7M3 14h18v4.5M21 14v-2.5a3 3 0 0 0-3-3h-7V14"/><circle cx="7" cy="10.7" r="1.8"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5v-4l2-5h12l2 5v4z"/><path d="M4 12.5h16"/><circle cx="7.5" cy="16.5" r="1.7"/><circle cx="16.5" cy="16.5" r="1.7"/></svg>',
  train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10.5h12M9 20.5l1.5-4M15 20.5l-1.5-4"/><circle cx="9.5" cy="13.5" r=".6"/><circle cx="14.5" cy="13.5" r=".6"/></svg>',
  ground:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  other:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/></svg>'
};
const LBL={ // field labels per kind
  flight:{title:"Airline + flight",from:"From",to:"To",start:"Departs",end:"Arrives",date:"Date",endDate:"Arrival date (if next day)",address:"Terminal / gate",conf:"Confirmation"},
  hotel:{title:"Hotel",from:"",to:"",start:"Check-in time",end:"Check-out time",date:"Check-in date",endDate:"Check-out date",address:"Address",conf:"Confirmation"},
  car:{title:"Rental company",from:"Pick-up location",to:"Drop-off location",start:"Pick-up time",end:"Drop-off time",date:"Pick-up date",endDate:"Drop-off date",address:"Vehicle",conf:"Confirmation"},
  train:{title:"Line + train",from:"From",to:"To",start:"Departs",end:"Arrives",date:"Date",endDate:"Arrival date (if next day)",address:"Car / seat",conf:"Confirmation"},
  ground:{title:"Company",from:"Pick-up",to:"Drop-off",start:"Pick-up time",end:"",date:"Date",endDate:"",address:"Driver / vehicle",conf:"Confirmation"},
  other:{title:"What",from:"From",to:"To",start:"Start time",end:"End time",date:"Date",endDate:"End date",address:"Where",conf:"Confirmation"}
};
const FIELDS=["title","from","to","start","end","address","conf","who","notes"];
let TRAVEL=[], PENDING=[], tvUnsub=null, tvLoaded=false;
const travelOn=k=>TRAVEL.filter(b=>b.date===k||(b.endDate&&b.date<k&&k<=b.endDate&&(b.kind==="hotel"||b.kind==="car")));
const travelDates=()=>[...new Set(TRAVEL.map(b=>b.date).filter(Boolean))];
function dayLabel(k){ const d=(byDate[k]||[])[0]; return shortDate(k)+(d?` · ${d.city}${d.type==="show"?", "+d.venue:""}`:" · no show that day"); }
function bkLine(b,k){
  const L=LBL[b.kind]||LBL.other;
  if(b.kind==="hotel"){ if(k&&b.endDate===k) return "Check out"+(b.end?" by "+b.end:""); if(k&&k>b.date) return "Staying here"+(b.endDate?" · out "+shortDate(b.endDate):""); return "Check in"+(b.start?" "+b.start:"")+(b.endDate?" · out "+shortDate(b.endDate):""); }
  if(b.kind==="car"&&k&&k>b.date) return (b.endDate===k?"Drop off":"Rental out")+(b.endDate===k&&b.end?" "+b.end:"")+(b.to?" · "+b.to:"");
  const route=[b.from,b.to].filter(Boolean).join(" → ");
  const times=[b.start,b.end].filter(Boolean).join(" – ");
  return [route,times].filter(Boolean).join(" · ");
}
function bookingHtml(b,k,opts={}){
  const can=CANEDIT||(ME&&b.addedBy===ME);
  const L=LBL[b.kind]||LBL.other;
  const meta=[b.conf&&`${esc(L.conf)} <b>${esc(b.conf)}</b>`, b.address&&esc(b.address), b.who&&esc(b.who), b.notes&&esc(b.notes)].filter(Boolean);
  if(b.kind==="hotel"&&b.address&&!opts.noMaps) meta[meta.indexOf(esc(b.address))]=`${esc(b.address)} <a href="https://maps.apple.com/?q=${encodeURIComponent(b.address)}" target="_blank" rel="noopener">Maps</a>`;
  return `<div class="bk k-${esc(b.kind)}"><span class="ki">${KI[b.kind]||KI.other}</span><div><div class="bt">${esc(b.title||KINDS[b.kind])}</div>${bkLine(b,k)?`<div class="bl">${esc(bkLine(b,k))}</div>`:""}${meta.length?`<div class="bm">${meta.map(m=>`<span>${m}</span>`).join("")}</div>`:""}${opts.dateLink?`<div class="bm"><a href="#d-${esc(b.date)}">${esc(dayLabel(b.date))} ›</a></div>`:""}</div>
    <div class="side">${b.imageUrl?`<button class="thumb" data-img="${esc(b.imageUrl)}" aria-label="View screenshot"><img src="${esc(b.imageUrl)}" alt="" loading="lazy"></button>`:""}${can?`<button class="glx" data-tvdel="${esc(b.id)}" aria-label="Remove">×</button>`:""}</div></div>`;
}
function travelCard(k){
  return `<section class="card" id="tv" data-date="${k}"><h3>Travel <small><a href="#travel">Add travel ›</a></small></h3><div id="tvbody">${travelCardBody(k)}</div></section>`;
}
function travelCardBody(k){
  if(!DB&&dbTried) return '<div class="empty">Sign in to claude.ai to see travel.</div>';
  if(!tvLoaded) return '<div class="empty">Loading travel…</div>';
  const bs=travelOn(k).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const d=(byDate[k]||[])[0];
  return (bs.length?bs.map(b=>bookingHtml(b,k)).join(""):'<div class="empty">No flights, hotels or cars filed for this date yet. Add a screenshot in Travel.</div>')+(d&&d.travel?`<div class="note">From the advance: ${esc(d.travel)}</div>`:"");
}
function refreshTravelBits(){
  const tb=document.getElementById("tvbody"); if(tb) tb.innerHTML=travelCardBody(document.getElementById("tv").dataset.date);
  const tl=document.getElementById("tvlist"); if(tl) tl.innerHTML=travelListHtml();
  const tc=document.getElementById("cnt-travel"); if(tc) tc.textContent=travelCount();
  if(state.view==="dates"){ const dl=document.getElementById("dlist"); if(dl) dl.innerHTML=datesListHtml(); bindRows(dl); }
}
function travelCount(){ if(!DB&&dbTried) return "Flights, hotels, cars"; if(!tvLoaded) return "Loading…"; const up=TRAVEL.filter(b=>(b.endDate||b.date)>=todayKey).length; return up?`${up} upcoming booking${up===1?"":"s"}`:"Add a ticket or hotel"; }
async function mountTravelFeed(){
  await dbReady; if(!DB||tvUnsub) { refreshTravelBits(); return; }
  const timer=setTimeout(()=>{ if(!tvLoaded){ tvLoaded=true; refreshTravelBits(); } },10000);
  tvUnsub=DB.collection("travel").onSnapshot(s=>{ clearTimeout(timer); const all=s.docs.map(d=>({id:d.id,...d.data()})); PENDING=all.filter(b=>b.status==="pending"); TRAVEL=all.filter(b=>b.date&&b.status!=="pending"); tvLoaded=true; refreshTravelBits(); }, e=>{ clearTimeout(timer); tvLoaded=true; refreshTravelBits(); });
}
function travelListHtml(){
  if(!DB&&dbTried) return '<div class="empty">Sign in to claude.ai to see and add travel.</div>';
  if(!tvLoaded) return '<div class="empty">Loading travel…</div>';
  const showPast=state.showPast;
  const bs=TRAVEL.filter(b=>showPast||(b.endDate||b.date)>=todayKey).sort((a,b)=>a.date.localeCompare(b.date)||(a.start||"").localeCompare(b.start||""));
  const pn=PENDING.length?`<div class="tvstatus"><span class="spin" style="animation:none;border-top-color:var(--field)"></span><span>${PENDING.length} screenshot${PENDING.length===1?"":"s"} waiting to be read. ${PENDING.length===1?"It gets":"They get"} filed on the right date by the next morning.</span></div>`:"";
  if(!bs.length) return pn+'<div class="empty">Nothing filed yet. Add the first screenshot above.</div>';
  const g={}; bs.forEach(b=>{(g[b.date]=g[b.date]||[]).push(b)});
  return pn+Object.entries(g).map(([k,list])=>`<section><h2>${esc(shortDate(k))}<a href="#d-${k}">${esc(((byDate[k]||[])[0]||{}).city||"Day sheet")} ›</a></h2>${list.map(b=>bookingHtml(b,k)).join("")}</section>`).join("");
}

// Reading a screenshot
async function toJpeg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.86));
  } finally { URL.revokeObjectURL(url); }
}
function readPrompt(){
  const days=sorted.map(d=>`${d.date} ${d.city} – ${d.venue} (${TYPE[d.type]})`).join("\n");
  return `You read travel confirmations for singer Macy Todd's touring team. Look at the attached screenshot (an airline ticket, boarding pass, hotel confirmation, rental car reservation, train ticket, rideshare or shuttle booking, or similar) and pull out every booking in it. Each flight leg, hotel stay, rental car, train or ride is its own booking.

Today is ${todayKey}. Macy's tour calendar (date, city, venue):
${days}

Use the tour calendar to pick the right year when the screenshot leaves it out.

Reply with only JSON in this shape:
{"bookings":[{"kind":"flight|hotel|car|train|ground|other","date":"YYYY-MM-DD","endDate":"YYYY-MM-DD or empty","title":"","from":"","to":"","start":"","end":"","address":"","conf":"","who":"","notes":""}]}

Field rules:
- kind: flight; hotel; car (rental car); train; ground (rideshare, car service, shuttle); other.
- date: flight or train departure date, hotel check-in date, rental pick-up date.
- endDate: hotel check-out date, rental drop-off date, or arrival date only if a flight lands on a later day. Otherwise empty.
- title: short label, like "Delta 1234", "Ace Hotel Toronto", "Hertz", "Amtrak 171".
- from / to: departure and arrival city with airport code, or rental pick-up and drop-off location. Empty for hotels.
- start / end: local times like "7:05 AM" (departure/arrival, check-in/check-out, pick-up/drop-off).
- address: hotel street address; for a rental car the vehicle class; for a flight the terminal or gate; for a train the car and seat.
- conf: confirmation number or record locator.
- who: traveler or guest names, comma separated.
- notes: seat numbers, room type, bags, or other useful detail, one short line.
Leave out prices, totals, payment card numbers and loyalty or frequent-flyer numbers. Use an empty string for anything you cannot read clearly rather than guessing. If the image is not a travel booking, reply {"bookings":[]}.`;
}
let SAMPLE=null, ASSETS=null, imgOK=false;
const capsReady=(async()=>{ try{ if(!window.claude) return; SAMPLE=await claude.use("sample"); ASSETS=await claude.use("assets"); if(SAMPLE){ const l=await SAMPLE.limits().catch(()=>null); imgOK=!!(l&&l.images); } }catch(e){} })();

function dateOptions(sel){
  const ks=[...new Set([...sorted.map(d=>d.date),sel].filter(Boolean))].filter(k=>k>=todayKey||k===sel).sort();
  return ks.map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(dayLabel(k))}</option>`).join("")+`<option value="__other">Another date…</option>`;
}
function reviewForm(b,i){
  b=Object.assign({kind:"flight",date:"",endDate:""},b||{}); if(!KINDS[b.kind]) b.kind="other";
  const L=LBL[b.kind];
  const f=(n,cls="")=>L[n]===""?"":`<label class="${cls}">${esc(L[n]||({who:"Travelers",notes:"Notes"})[n])}<input name="${n}" value="${esc(b[n]||"")}" autocomplete="off"></label>`;
  return `<form class="rv" data-i="${i}">
    <div class="kinds" role="group" aria-label="Type">${Object.entries(KINDS).map(([k,v])=>`<button type="button" data-kind="${k}" aria-pressed="${k===b.kind}">${v}</button>`).join("")}</div>
    <input type="hidden" name="kind" value="${b.kind}">
    <div class="fgrid">
      ${f("title","full")}
      <label class="full">${esc(L.date)}<select name="date">${dateOptions(b.date)}</select><input name="dateOther" type="date" value="${esc(b.date)}" hidden></label>
      ${f("from")}${f("to")}${f("start")}${f("end")}
      ${L.endDate?`<label class="full">${esc(L.endDate)}<input name="endDate" type="date" value="${esc(b.endDate||"")}"></label>`:""}
      ${f("address","full")}${f("conf")}${f("who")}
      <label class="full">Notes<textarea name="notes">${esc(b.notes||"")}</textarea></label>
    </div>
    <div class="rv-files" data-files></div>
    <div class="btnrow"><button class="btn" type="submit">Save to this date</button><button class="btn sec" type="button" data-discard>Discard</button></div>
  </form>`;
}
function formData(form){
  const g=n=>{const el=form.elements[n]; return el?el.value.trim():"";};
  let date=g("date"); if(date==="__other") date=g("dateOther");
  const b={kind:g("kind"),date,endDate:g("endDate")};
  FIELDS.forEach(n=>b[n]=g(n));
  return b;
}
function wireForm(form,draft,onDone){
  const upd=()=>{ const b=formData(form); const el=form.querySelector("[data-files]"); const sel=form.elements.date; form.elements.dateOther.hidden=sel.value!=="__other";
    if(!b.date){ el.textContent="Pick a date to file it on."; el.className="rv-files none"; return; }
    el.className="rv-files"+((byDate[b.date]||[]).length?"":" none"); el.textContent="Files on "+dayLabel(b.date)+((byDate[b.date]||[]).length?"":" (shows as a travel day)"); };
  form.addEventListener("input",upd); form.addEventListener("change",upd); upd();
  form.querySelectorAll("[data-kind]").forEach(btn=>btn.onclick=()=>{ const cur=formData(form); cur.kind=btn.dataset.kind; const tmp=document.createElement("div"); tmp.innerHTML=reviewForm(cur,form.dataset.i); const nf=tmp.firstElementChild; form.replaceWith(nf); wireForm(nf,draft,onDone); });
  form.querySelector("[data-discard]").onclick=()=>{ form.remove(); onDone&&onDone(); };
  form.onsubmit=async e=>{ e.preventDefault(); const b=formData(form); const btn=form.querySelector("button[type=submit]");
    if(!b.date){ upd(); return; } if(!DB){ alertMsg("Sign in to claude.ai to save travel."); return; }
    btn.disabled=true; btn.textContent="Saving…";
    try{
      await DB.collection("travel").add({...b, imageId:draft.imageId||"", imageUrl:draft.imageUrl||"", addedBy:ME||"", addedAt:new Date().toISOString(), source:draft.imageId||draft.read?"screenshot":"app"});
      const done=document.createElement("div"); done.className="tvstatus"; done.innerHTML=`<span>Saved. It's on <a href="#d-${esc(b.date)}">${esc(dayLabel(b.date))}</a>.</span>`; form.replaceWith(done); setTimeout(()=>{ if(done.isConnected) done.remove(); onDone&&onDone(); },6000);
    }catch(err){ btn.disabled=false; btn.textContent="Save to this date"; alertMsg(err&&err.code==="not_granted"?"You can view travel but not add to it. Ask Drake for edit access.":"That didn't save. Try again."); }
  };
}
function alertMsg(t){ const m=document.getElementById("tvmsg"); if(m){ m.hidden=false; m.textContent=t; } }
async function handleShot(file){
  const out=document.getElementById("tvreview"), msg=document.getElementById("tvmsg"); msg.hidden=true;
  const prev=URL.createObjectURL(file);
  out.innerHTML=`<div class="tvstatus"><img src="${prev}" alt=""><span class="spin"></span><span id="tvst">Reading the screenshot…</span></div>`;
  let jpeg; try{ jpeg=await toJpeg(file); }catch(e){ out.innerHTML=""; alertMsg("That image couldn't be opened. Try a PNG or JPG screenshot."); return; }
  const draft={read:true};
  const up=(async()=>{ if(!ASSETS) return; try{ const r=await ASSETS.upload(jpeg); draft.imageId=r.id; draft.imageUrl=r.url; }catch(e){} })();
  let bookings=[];
  try{
    const r=await SAMPLE.json(readPrompt(),{images:[jpeg]});
    bookings=(r&&Array.isArray(r.bookings))?r.bookings:[];
  }catch(e){
    await up;
    if(e&&e.code==="no_key"){
      try{ await DB.collection("travel").add({kind:"other",date:"",status:"pending",imageId:draft.imageId||"",imageUrl:draft.imageUrl||"",addedBy:ME||"",addedAt:new Date().toISOString(),source:"screenshot"});
        out.innerHTML=`<div class="tvstatus"><img src="${prev}" alt=""><span>Saved. This one gets read and filed on the right date by tomorrow morning. Need it sooner? Enter it by hand.</span></div>`; return;
      }catch(err){}
    }
    out.innerHTML="";
    alertMsg(e&&e.code==="no_key"?"Screenshot reading isn't switched on yet. Enter it by hand for now.":e&&e.code==="not_granted"?"Reading screenshots needs your OK to use Claude. You can still enter it by hand.":e&&e.code==="rate_limited"?"Too many at once. Wait a minute and try again.":"Couldn't read that one. Enter it by hand below, or try a clearer screenshot.");
    showManual(draft); return;
  }
  await up;
  if(!bookings.length){ out.innerHTML=""; alertMsg("No booking found in that image. Enter it by hand, or try another screenshot."); showManual(draft); return; }
  const st=document.getElementById("tvst"); if(st) st.textContent=`Found ${bookings.length} booking${bookings.length===1?"":"s"}. Check the details and save.`;
  out.querySelector(".spin")?.remove();
  bookings.forEach((b,i)=>{ const tmp=document.createElement("div"); tmp.innerHTML=reviewForm(b,i); const f=tmp.firstElementChild; out.appendChild(f); wireForm(f,draft,()=>{ if(!out.querySelector("form")) setTimeout(()=>{ if(!out.querySelector("form")) out.innerHTML=""; },50); }); });
}
function showManual(draft){
  const out=document.getElementById("tvreview"); const tmp=document.createElement("div"); tmp.innerHTML=reviewForm({kind:"flight",date:next.date},0);
  const f=tmp.firstElementChild; out.appendChild(f); wireForm(f,draft||{},()=>{});
  f.scrollIntoView({behavior:"smooth",block:"start"});
}

async function unlockDeals(pw){
  const B=T.dealsBlob, b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)), enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:B.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c))));
}

  return `<div class="detail">${MG_BACK}<div class="page"><div class="pagehead"><h1>Budget</h1><p>Each tour on its own, live from that tour's budget sheet. Open a tour to see its totals, fill in fees and costs, and keep its receipts and invoices.</p></div>
  <div id="budbox"><div class="empty">Loading the budget…</div></div>

const isNeg=v=>/^-|^\(/.test(String(v||"").trim());
function budRender(){
  const box=document.getElementById("budbox"); if(!box||!BUD) return;
  const feed={}; (BUD.feed||[]).forEach(f=>feed[(f.sheet||"")+"|"+f.date]=f);
  const opts=(list,cur)=>list.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  const dlabel=k=>pd(k).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const sheetOf=date=>((BUD.shows.find(s=>s.date===date&&(!budTour||inT(s)))||{}).sheet||"");
  const costForm=(c,date)=>{ c=c||{date,category:"",what:"",paidTo:"",budget:"",actual:"",paid:false,notes:""};
    return `<form class="bform" data-cost="${c.row||""}" data-sheet="${esc(c.sheet||sheetOf(date))}"><div class="row2"><label>Show<select name="date">${BUD.shows.filter(s=>!budTour||inT(s)).map(s=>`<option value="${s.date}"${s.date===c.date?" selected":""}>${esc(dlabel(s.date)+" · "+s.city)}</option>`).join("")}</select></label>
      <label>Category<select name="category" required><option value="">Pick one</option>${opts(BUD.categories,c.category)}</select></label></div>
      <label>What it's for<input name="what" value="${esc(c.what)}" required></label>
      <label>Paid to<input name="paidTo" value="${esc(c.paidTo)}"></label>
      <div class="row2"><label>Budget ($)<input name="budget" inputmode="decimal" value="${esc(c.budget)}"></label><label>Actual ($)<input name="actual" inputmode="decimal" value="${esc(c.actual)}"></label></div>
      <label class="chk"><input type="checkbox" name="paid"${c.paid?" checked":""}> Paid</label>
      <label>Notes<input name="notes" value="${esc(c.notes)}"></label>
      <div class="err" hidden></div>
      <div class="bacts"><button class="btn" type="submit">Save</button><button class="btn sec" type="button" data-cancel>Cancel</button>${c.row?'<button class="btn del" type="button" data-del>Delete</button>':""}</div></form>`; };
  const incForm=s=>`<form class="bform" data-show="${s.row}" data-sheet="${esc(s.sheet||"")}"><div class="row2"><label>Fee<input name="fee" inputmode="decimal" value="${esc(s.fee)}"></label><label>Currency<select name="currency">${opts(BUD.currencies,s.currency||"USD")}</select></label></div>
      <div class="row2"><label>Merch (net, $)<input name="merch" inputmode="decimal" value="${esc(s.merch)}"></label><label>Other income ($)<input name="other" inputmode="decimal" value="${esc(s.other)}"></label></div>
      <label>Notes<input name="notes" value="${esc(s.notes)}"></label><div class="err" hidden></div>
      <div class="bacts"><button class="btn" type="submit">Save</button><button class="btn sec" type="button" data-cancel>Cancel</button></div></form>`;
  const tours=BUD.tours.map(r=>({name:r[0],dates:r[1],shows:r[2],income:r[3],costs:r[4],net:r[5],missing:r[7],sheet:r[8]||"",url:r[9]||"",incl:r[10]||""}));
  const inT=x=>(x.group||x.tour)===budTour;
  const stat=(k,v,neg)=>`<div class="bstat${neg?" neg":""}"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;
  const t=budTour&&tours.find(x=>x.name===budTour);
  if(!t){ budTour=null;
    const mb=document.querySelector(".detail>a.back"); if(mb) mb.hidden=false; const ph=document.querySelector(".detail .pagehead"); if(ph) ph.hidden=false;
    box.innerHTML=tours.length?`<div class="btlist">${tours.map(t=>`<button type="button" class="card btcard" data-tour="${esc(t.name)}"><span class="btn-name">${esc(t.name)}</span><span class="btmeta">${t.incl?esc(t.incl)+" · ":""}${esc(t.dates)} · ${esc(t.shows)} show${+t.shows===1?"":"s"}${+t.missing?` · <span class="bmiss">${esc(t.missing)} need a number</span>`:""}</span><span class="btgo" aria-hidden="true">›</span></button>`).join("")}</div>`:'<div class="empty">No tours in the budget sheet yet.</div>';
    box.insertAdjacentHTML("beforeend",`<p class="note">As of ${esc(BUD.asOf||"")}. Pull down to refresh.</p>`); return; }
  const mb=document.querySelector(".detail>a.back"); if(mb) mb.hidden=true; const ph=document.querySelector(".detail .pagehead"); if(ph) ph.hidden=true;
  const shows=BUD.shows.filter(inT);
  box.innerHTML=`<button type="button" class="back" data-alltours>‹ All tours</button>
  <section class="btour"><h2 class="bt-name">${esc(t.name)}</h2><div class="bt-sub">${t.incl?esc(t.incl)+" · ":""}${esc(t.dates)} · ${esc(t.shows)} show${+t.shows===1?"":"s"}${t.url?` · <a href="${esc(t.url)}" target="_blank" rel="noopener">Open this tour's sheet</a>`:""}</div>
  <div class="bstats">${stat("Gross",t.income)}${stat("Costs",t.costs)}${stat("Net",t.net,isNeg(t.net))}${stat("Costs missing a number",t.missing||"0")}</div>
  <p class="note bcaa">CAA commission (10%) is added to each show's costs on its own line. Tap a show to fill in a fee, merch or a cost.</p>
  <h2 class="mhead">Shows</h2>
    ${shows.map(s=>{ const lines=BUD.costs.filter(c=>c.date===s.date&&(!c.sheet||c.sheet===s.sheet)), miss=+((feed[(s.sheet?s.sheet:"")+"|"+s.date]||{}).costs_missing||0), op=budOpen.has(s.date);
      return `<details class="card bshow" data-date="${s.date}"${op?" open":""}><summary><span class="bd">${esc(dlabel(s.date))}</span><span class="bv">${esc(s.venue||s.city)}</span><span class="bnet bnum${isNeg(s.net)?" neg":""}">${esc(s.net)}</span><span class="bc">${esc(s.city)} · gross ${esc(s.income)} · costs ${esc(s.costs)}${miss?` · <span class="bmiss">${miss} need a number</span>`:""}</span></summary>
      <div class="bbody"><h3>Income</h3>
      ${budForm&&budForm.k==="inc"&&budForm.date===s.date?incForm(s):`<dl class="kv"><div><dt>Fee</dt><dd>${s.fee!==""?esc(s.fee+" "+(s.currency||"")):"Not set"}${s.currency&&s.currency!=="USD"&&s.feeUsd?` (${esc(s.feeUsd)})`:""}</dd></div><div><dt>Merch</dt><dd>${s.merch!==""?"$"+esc(s.merch):"Not set"}</dd></div>${s.other!==""?`<div><dt>Other</dt><dd>$${esc(s.other)}</dd></div>`:""}${s.notes?`<div><dt>Notes</dt><dd>${esc(s.notes)}</dd></div>`:""}</dl>
      <div class="bacts"><button class="btn sec" type="button" data-editinc="${s.date}">Edit income</button></div>`}
      <h3>Costs</h3>
      <div>${lines.length?lines.map(c=> budForm&&budForm.k==="cost"&&budForm.row===c.row?costForm(c):`<button type="button" class="bline${c.counts?"":" need"}" data-row="${c.row}"><span class="bw">${esc(c.what||c.category)}</span><span class="ba">${c.counts?esc(c.counts):"Needs a number"}</span><span class="bm">${esc([c.category,c.paidTo,c.actual!==""?"actual":c.budget!==""?"budget":"",c.paid?"paid":""].filter(Boolean).join(" · "))}${c.notes?" · "+esc(c.notes):""}</span></button>`).join(""):'<div class="empty">No costs yet.</div>'}</div>
      ${budForm&&budForm.k==="new"&&budForm.date===s.date?costForm(null,s.date):`<div class="bacts"><button class="btn sec" type="button" data-addcost="${s.date}">Add a cost</button></div>`}
      </div></details>`; }).join("")}${docsHtml(t)}</section>
  <p class="note">As of ${esc(BUD.asOf||"")}. Pull down to refresh.</p>`;
}
async function budLoad(){
  const box=document.getElementById("budbox");
  try{ const j=await bcall({action:"budgetGet"}); BUD=j; budRender(); }
  catch(e){ if(box) box.innerHTML=`<div class="empty">${e.code==="unauthorized"||e.code==="unknown action"?"The budget isn't connected yet. The app's Google backend needs its update (see the setup note).":"The budget couldn't load right now. Check your connection and pull down to try again."}</div>`; }
}
function mountBudget(){
  const box=document.getElementById("budbox"); if(!box) return;
  if(BUD) budRender(); budLoad();
  box.addEventListener("toggle",e=>{ const d=e.target.closest&&e.target.closest("details.bshow"); if(!d) return; if(d.open) budOpen.add(d.dataset.date); else budOpen.delete(d.dataset.date); },true);
  box.onclick=e=>{ const t=e.target;
    const tc=t.closest("[data-tour]"); if(tc){ setBudTour(tc.dataset.tour); return; }
    if(t.closest("[data-alltours]")){ setBudTour(null); return; }
    const ad=t.closest("[data-adddoc]"); if(ad){ budForm={k:"newdoc",kind:ad.dataset.adddoc}; budRender(); return; }
    const de=t.closest("[data-docedit]"); if(de){ budForm={k:"doc",row:+de.dataset.docedit}; budRender(); return; }
    const dd=t.closest("[data-docdel]"); if(dd){ budDocSave(dd.closest("form"),"delete"); return; }
    const ei=t.closest("[data-editinc]"); if(ei){ budForm={k:"inc",date:ei.dataset.editinc}; budRender(); return; }
    const ac=t.closest("[data-addcost]"); if(ac){ budForm={k:"new",date:ac.dataset.addcost}; budRender(); return; }
    const bl=t.closest(".bline"); if(bl){ budForm={k:"cost",row:+bl.dataset.row}; budRender(); return; }
    if(t.closest("[data-cancel]")){ budForm=null; budRender(); return; }
    const del=t.closest("[data-del]"); if(del){ const f=del.closest("form"); budSave(f,"delete"); }
  };
  box.onsubmit=e=>{ e.preventDefault(); if(e.target.classList.contains("bdocf")) budDocSave(e.target); else budSave(e.target); };
}
async function budSave(f,mode){
  if(budBusy) return; const err=f.querySelector(".err"); const v=Object.fromEntries(new FormData(f).entries());
  budBusy=true; f.querySelectorAll("button").forEach(b=>b.disabled=true); err.hidden=true;
  try{
    if(f.dataset.show) await bcall({action:"budgetShow",sheet:f.dataset.sheet||undefined,row:+f.dataset.show,fields:{fee:v.fee,currency:v.currency,merch:v.merch,other:v.other,notes:v.notes}});
    else if(mode==="delete") await bcall({action:"budgetCostDelete",sheet:f.dataset.sheet||undefined,row:+f.dataset.cost});
    else await bcall({action:"budgetCost",sheet:f.dataset.sheet||undefined,row:f.dataset.cost?+f.dataset.cost:0,fields:Object.assign({date:v.date,category:v.category,what:v.what,paidTo:v.paidTo,budget:v.budget,actual:v.actual,paid:!!v.paid,notes:v.notes},f.dataset.cost?{}:{source:"App"})});
    if(v.date) budOpen.add(v.date);
    budForm=null; await budLoad();
  }catch(e2){ err.textContent=e2.message&&e2.message!=="failed"?"Couldn't save: "+e2.message:"Couldn't save. Check your connection and try again."; err.hidden=false; f.querySelectorAll("button").forEach(b=>b.disabled=false); }
  budBusy=false;
}

// ---- In-app PDF viewer (links to files don't open reliably inside the app frame on iPhone) ----
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s)})}
let pdfReady=null, pdfDoc=null, zoom=1, pdfToken=0;
function ensurePdf(){ if(!pdfReady){ pdfReady=loadScript(PDFJS+"pdf.min.js").then(()=>loadScript(PDFJS+"pdf.worker.min.js")).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; }); pdfReady.catch(()=>{pdfReady=null}); } return pdfReady; }
const pv=document.getElementById("pdfv"), pages=document.getElementById("pdfpages");
async function renderPdf(){
  const tok=++pdfToken; pages.innerHTML="";
  const w=Math.min(pages.clientWidth-24, 1000)*zoom, dpr=Math.min(window.devicePixelRatio||1,3);
  for(let i=1;i<=pdfDoc.numPages;i++){
    const page=await pdfDoc.getPage(i); if(tok!==pdfToken) return;
    const base=page.getViewport({scale:1}), vp=page.getViewport({scale:(w*dpr)/base.width});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    c.style.width=w+"px"; c.style.height=(w*base.height/base.width)+"px"; c.setAttribute("aria-label","Page "+i);
    pages.appendChild(c);
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  }
}
async function openPdf(file,title){
  document.getElementById("pdft").textContent=title||"PDF";
  pv.hidden=false; document.body.style.overflow="hidden"; zoom=1;
  pages.innerHTML='<div class="pdfmsg">Opening…</div>';
  try{
    await ensurePdf();
    const buf=await (await fetch(file)).arrayBuffer();
    pdfDoc=await window.pdfjsLib.getDocument({data:buf}).promise;
    await renderPdf();
  }catch(e){ pages.innerHTML='<div class="pdfmsg">This PDF didn\'t load. Check your connection and try again.</div>'; console.error(e); }
}
function closePdf(){ pv.hidden=true; document.body.style.overflow=""; pdfToken++; pages.innerHTML=""; pdfDoc=null; }
document.getElementById("pdfclose").onclick=closePdf;
document.getElementById("zi").onclick=()=>{ if(pdfDoc&&zoom<3){zoom+=.5;renderPdf()} };
document.getElementById("zo").onclick=()=>{ if(pdfDoc&&zoom>1){zoom-=.5;renderPdf()} };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!pv.hidden) closePdf(); });
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href$=".pdf"]'); if(!a) return;
  e.preventDefault(); const dt=a.querySelector(".dt"); openPdf(a.getAttribute("href"), (dt?dt.textContent:a.textContent).replace(/\s*\(PDF\)$/,"").trim());
});
let lastScroll=0;
window.addEventListener("hashchange",()=>{readHash();render(); window.scrollTo(0, state.view==="dates"?lastScroll:0)});
readHash(); render(); mountTravelFeed();
};

<script>
// Hosted-site stand-in for the claude.ai runtime: guest lists, travel and screenshots
// go to the Google Apps Script backend (Code.gs) instead of the artifact database.
window.makeHostedClaude=function(api){
  const call=async body=>{
    const r=await fetch(api.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:api.token},body))});
    const j=await r.json();
    if(!j.ok){ const e=new Error(j.error||"failed"); e.code=j.error||"failed"; throw e; }
    return j;
  };
  const subs=new Set();
  const tableOf=p=>{ if(p==="travel") return {table:"Travel"}; if(p==="guests") return {table:"Guests"}; const m=p.match(/^guests\/(\d{4}-\d{2}-\d{2})\/entries$/); if(m) return {table:"Guests",date:m[1]}; throw new Error("bad path "+p); };
  const refresh=path=>subs.forEach(s=>{ if(s.path===path) s.pull(); });
  const norm=r=>{ const o=Object.assign({},r); if("plus" in o) o.plus=Number(o.plus)||0; return o; };
  const db={collection(path){ const t=tableOf(path); return {
    onSnapshot(ok,err){
      const s={path,pull:async()=>{ try{ const j=await call({action:"list",table:t.table,date:t.date}); ok({docs:j.rows.map(r=>({id:r.id,data:()=>norm(r)}))}); }catch(e){ err&&err(e); } }};
      subs.add(s); s.pull();
      const iv=setInterval(()=>{ if(!document.hidden) s.pull(); },30000);
      return ()=>{ subs.delete(s); clearInterval(iv); };
    },
    async add(row){ const j=await call({action:"add",table:t.table,row:Object.assign({},row,{date:row.date||t.date||""})}); refresh(path); return {id:j.id}; },
    doc(id){ return {
      async update(p){ await call({action:"update",table:t.table,id,patch:p}); refresh(path); },
      async delete(){ await call({action:"remove",table:t.table,id}); refresh(path); }
    }; }
  }; }};
  const dev=()=>{ try{ let n=localStorage.getItem("mt-dev"); if(!n){ n="d_"+Math.random().toString(36).slice(2,10); localStorage.setItem("mt-dev",n); } return n; }catch(e){ return "d_anon"; } };
  const user={id:async()=>dev(),canEdit:()=>true};
  const b64=blob=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
  const sample=Object.assign(async()=>{ throw {code:"unavailable"}; },{
    limits:async()=>({images:{maxCount:1}}),
    json:async(prompt,o)=>{ const img=o&&o.images&&o.images[0]; if(!img) throw {code:"invalid_request"};
      try{ const j=await call({action:"read",prompt,data:await b64(img),type:img.type||"image/jpeg"}); return j.value; }
      catch(e){ throw {code:e.code||"failed"}; } }
  });
  const assets={upload:async blob=>{ const j=await call({action:"upload",data:await b64(blob),type:blob.type||"image/jpeg"}); return {id:j.id,url:j.url}; }};
  const caps={db,user,sample,assets};

(function(){
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const B=window.TOURBLOB, enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:B.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function go(pw,remember){
  try{ window.TOUR=await unlock(pw); }catch(e){ return false; }
  if(remember){ try{localStorage.setItem("mt-pw",pw)}catch(e){} }
  if(window.TOUR.api && window.makeHostedClaude) window.claude=window.makeHostedClaude(window.TOUR.api);
  document.getElementById("lock").remove(); window.startApp(); return true;
}
document.getElementById("lockf").addEventListener("submit",async e=>{e.preventDefault();
  const ok=await go(document.getElementById("pw").value,true); if(!ok){document.getElementById("lockerr").hidden=false;}});
let saved=null; try{saved=localStorage.getItem("mt-pw")}catch(e){}
(async()=>{ if(!(saved && await go(saved,false))){ try{localStorage.removeItem("mt-pw")}catch(e){} document.getElementById("pw").focus(); } })();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();

/* pull down to refresh: reloads the app, which fetches the newest version (the saved password reopens it) */
(function(){
  const el=document.createElement("div"); el.className="ptr"; el.setAttribute("aria-hidden","true");
  el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  document.body.appendChild(el);
  const MAX=110, GO=72; let y0=null, dy=0, busy=false;
  const blocked=t=>!!(t.closest&&t.closest("input,textarea,select,.pdfv,.imgv,#lock"))||!!document.querySelector(".pdfv:not([hidden]),.imgv:not([hidden])");
  function show(d){ const k=Math.min(d,MAX); el.style.transition="none"; el.style.opacity=Math.min(1,k/GO); el.style.transform=`translateY(${k-60}px)`; el.classList.toggle("ready",d>=GO); }
  function hide(){ el.style.transition="transform .25s, opacity .25s"; el.style.opacity=0; el.style.transform="translateY(-60px)"; el.classList.remove("ready"); }
  addEventListener("touchstart",e=>{ if(busy||e.touches.length!==1||window.scrollY>0||blocked(e.target)){y0=null;return;} y0=e.touches[0].clientY; dy=0; },{passive:true});
  addEventListener("touchmove",e=>{ if(y0==null) return; dy=(e.touches[0].clientY-y0)*0.55; if(dy>0&&window.scrollY<=0) show(dy); else if(dy<=0) hide(); },{passive:true});
  addEventListener("touchend",()=>{ if(y0==null) return; y0=null;
    if(dy>=GO){ busy=true; el.classList.remove("ready"); el.classList.add("busy"); el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>'; el.style.transition="transform .2s"; el.style.transform="translateY(14px)";
      const go=()=>location.reload();
      (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}):Promise.resolve()).then(()=>setTimeout(go,350));
    } else hide(); dy=0; },{passive:true});
})();
</script>
